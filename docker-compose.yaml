
name: aviation-data-platform

services:
  
  # KAFKA - KRaft cluster
  
  kafka1:
    image: confluentinc/cp-kafka:7.7.0
    container_name: kafka1
    hostname: kafka1
    ports:
      - "127.0.0.1:9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka1:29093,2@kafka2:29093"
      KAFKA_LISTENERS: "PLAINTEXT://kafka1:29092,PLAINTEXT_HOST://0.0.0.0:9092,CONTROLLER://kafka1:29093"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka1:29092,PLAINTEXT_HOST://localhost:9092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT"
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      CLUSTER_ID: "${KAFKA_CLUSTER_ID:-MkU3OEVBNTcwNTJENDM2Qk}"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 2
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 2
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_DEFAULT_REPLICATION_FACTOR: 2
      KAFKA_MIN_INSYNC_REPLICAS: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    volumes:
      - kafka-data-1:/var/lib/kafka/data
    networks:
      - aviation
    healthcheck:
      test:
        - CMD
        - kafka-topics
        - --bootstrap-server
        - kafka1:29092
        - --list
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  kafka2:
    image: confluentinc/cp-kafka:7.7.0
    container_name: kafka2
    hostname: kafka2
    ports:
      - "127.0.0.1:9093:9093"
    environment:
      KAFKA_NODE_ID: 2
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka1:29093,2@kafka2:29093"
      KAFKA_LISTENERS: "PLAINTEXT://kafka2:29092,PLAINTEXT_HOST://0.0.0.0:9093,CONTROLLER://kafka2:29093"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka2:29092,PLAINTEXT_HOST://localhost:9093"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT"
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      CLUSTER_ID: "${KAFKA_CLUSTER_ID:-MkU3OEVBNTcwNTJENDM2Qk}"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 2
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 2
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_DEFAULT_REPLICATION_FACTOR: 2
      KAFKA_MIN_INSYNC_REPLICAS: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    volumes:
      - kafka-data-2:/var/lib/kafka/data
    networks:
      - aviation
    healthcheck:
      test:
        - CMD
        - kafka-topics
        - --bootstrap-server
        - kafka2:29092
        - --list
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  
  # KAFKA SCHEMA REGISTRY
  
  schema-registry:
    image: confluentinc/cp-schema-registry:7.7.0
    container_name: aviation-schema-registry
    hostname: schema-registry
    ports:
      - "127.0.0.1:8081:8081"
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_LISTENERS: "http://0.0.0.0:8081"
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: "PLAINTEXT://kafka1:29092,PLAINTEXT://kafka2:29092"
      SCHEMA_REGISTRY_KAFKASTORE_TOPIC_REPLICATION_FACTOR: 2
    depends_on:
      kafka1:
        condition: service_healthy
      kafka2:
        condition: service_healthy
    networks:
      - aviation
    restart: unless-stopped

  
  # KAFDROP - KAFKA WEB UI
  
  kafdrop:
    image: obsidiandynamics/kafdrop:latest
    container_name: aviation-kafdrop
    ports:
      - "127.0.0.1:9001:9000"
    environment:
      KAFKA_BROKERCONNECT: "kafka1:29092,kafka2:29092"
      SCHEMAREGISTRY_CONNECT: "http://schema-registry:8081"
      JVM_OPTS: "-Xms128M -Xmx512M"
    depends_on:
      kafka1:
        condition: service_healthy
      kafka2:
        condition: service_healthy
      schema-registry:
        condition: service_started
    networks:
      - aviation
    restart: unless-stopped

  
  # SPARK MASTER
  
  spark-master:
    image: apache/spark:3.5.6
    container_name: spark-master
    hostname: spark-master
    command:
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.master.Master
    ports:
      - "127.0.0.1:9090:8080"
      - "127.0.0.1:7077:7077"
    volumes:
      - ./streaming:/streaming
      - ./batching:/batching
    networks:
      - aviation
    restart: unless-stopped

  
  # SPARK WORKER 1
  
  spark-worker1:
    image: apache/spark:3.5.6
    container_name: spark-worker1
    hostname: spark-worker1
    command:
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.worker.Worker
      - spark://spark-master:7077
    environment:
      SPARK_WORKER_MEMORY: 4g
      SPARK_WORKER_CORES: 4
    ports:
      - "127.0.0.1:9101:8081"
    volumes:
      - ./streaming:/streaming
      - ./batching:/batching
    depends_on:
      - spark-master
    networks:
      - aviation
    restart: unless-stopped

  
  # SPARK WORKER 2
  
  spark-worker2:
    image: apache/spark:3.5.6
    container_name: spark-worker2
    hostname: spark-worker2
    command:
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.worker.Worker
      - spark://spark-master:7077
    environment:
      SPARK_WORKER_MEMORY: 4g
      SPARK_WORKER_CORES: 4
    ports:
      - "127.0.0.1:9102:8081"
    volumes:
      - ./streaming:/streaming
      - ./batching:/batching
    depends_on:
      - spark-master
    networks:
      - aviation
    restart: unless-stopped

  
  # CLICKHOUSE - ANALYTICAL DATABASE
  
  clickhouse:
    image: clickhouse/clickhouse-server:latest
    container_name: clickhouse-server
    hostname: clickhouse
    ports:
      - "127.0.0.1:8123:8123"
      - "127.0.0.1:9000:9000"
    environment:
      CLICKHOUSE_DB: "${CLICKHOUSE_DATABASE:-aviation}"
      CLICKHOUSE_USER: "${CLICKHOUSE_ADMIN:-aviation_admin}"
      CLICKHOUSE_PASSWORD: "${CLICKHOUSE_PASSWORD:?Set CLICKHOUSE_PASSWORD in your .env file}"
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - clickhouse_logs:/var/log/clickhouse-server
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    networks:
      - aviation

    restart: unless-stopped

  
  # REDIS - CACHE / LATEST FLIGHT STATE
  
  redis:
    image: redis:7-alpine
    container_name: aviation-redis
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    command:
      - redis-server
      - --appendonly
      - "yes"
    networks:
      - aviation

    restart: unless-stopped

  
  # PROMETHEUS - METRICS COLLECTION
  
  prometheus:
    image: prom/prometheus:latest
    container_name: aviation-prometheus
    ports:
      - "127.0.0.1:9096:9090"
    volumes:
      - ./monitoring/prometheus:/etc/prometheus:ro
      - prometheus_data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle
    depends_on:
      - spark-master
      - spark-worker1
      - spark-worker2
      - kafka-exporter
    networks:
      - aviation
    restart: unless-stopped

  
  # GRAFANA - MONITORING DASHBOARDS
  
  grafana:
    image: grafana/grafana:latest
    container_name: aviation-grafana
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: "${GRAFANA_ADMIN_USER}"
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD}"
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    networks:
      - aviation
    restart: unless-stopped

  
  # ALERTMANAGER
  
  alertmanager:
    image: prom/alertmanager:latest
    container_name: aviation-alertmanager
    ports:
      - "127.0.0.1:9094:9093"
    volumes:
      - ./monitoring/alertmanager:/etc/alertmanager:ro
      - alertmanager_data:/alertmanager
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    networks:
      - aviation
    restart: unless-stopped

  
  # KAFKA EXPORTER - KAFKA METRICS
  
  kafka-exporter:
    image: danielqsj/kafka-exporter:latest
    container_name: aviation-kafka-exporter
    command:
      - --kafka.server=kafka1:29092
      - --kafka.server=kafka2:29092
    ports:
      - "127.0.0.1:9308:9308"
    depends_on:
      kafka1:
        condition: service_healthy
      kafka2:
        condition: service_healthy
    networks:
      - aviation
    restart: unless-stopped

  
  # CADVISOR - CONTAINER METRICS
  
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: aviation-cadvisor
    ports:
      - "127.0.0.1:8083:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    privileged: true
    devices:
      - /dev/kmsg
    networks:
      - aviation
    restart: unless-stopped


# PERSISTENT VOLUMES

volumes:
  kafka-data-1:
  kafka-data-2:
  clickhouse_data:
  clickhouse_logs:
  redis_data:
  grafana-data:
  prometheus_data:
  alertmanager_data:


# NETWORK

networks:
  aviation:
    driver: bridge
  