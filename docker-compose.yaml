  # CLICKHOUSE - ANALYTICAL DATABASE
  
  clickhouse:
    image: clickhouse/clickhouse-server:26.8
    container_name: clickhouse-server
    hostname: clickhouse
    ports:
      - "127.0.0.1:8123:8123"
      - "127.0.0.1:9000:9000"
    environment:
      CLICKHOUSE_DB: "${CLICKHOUSE_DATABASE:-aviation}"
      CLICKHOUSE_USER: "${CLICKHOUSE_ADMIN:-aviation_admin}"
      CLICKHOUSE_PASSWORD: "${CLICKHOUSE_PASSWORD:?Set CLICKHOUSE_PASSWORD in your .env file}"
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - clickhouse_logs:/var/log/clickhouse-server
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    networks:
      - aviation

    restart: unless-stopped

  
  # REDIS - CACHE / LATEST FLIGHT STATE
  
  redis:
    image: redis:7-alpine
    container_name: aviation-redis
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    command:
      - redis-server
      - --appendonly
      - "yes"
    networks:
      - aviation

    restart: unless-stopped

  weather-api:
    build:
      context: ./fast_api
      dockerfile: Dockerfile
    container_name: weather-api
    env_file:
      - .env
    environment:
      REDIS_HOST: redis
      REDIS_PORT: "6379"
    ports:
      - "8000:8000"
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')" ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - aviation

  weather-dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    container_name: weather-dashboard
    depends_on:
      weather-api:
        condition: service_healthy
    environment:
      WEATHER_API_URL: http://weather-api:8000
    ports:
      - "8501:8501"
    restart: unless-stopped
    networks:
      - aviation


# PERSISTENT VOLUMES

volumes:
  kafka-data-1:
  kafka-data-2:
  clickhouse_data:
  clickhouse_logs:
  redis_data:
  weather_checkpoints:
  weather_ivy_cache:
  airflow_pgdata:
  airflow_logs:



# NETWORK

networks:
  aviation:
    driver: bridge
  