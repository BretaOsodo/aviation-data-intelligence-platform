  # SPARK MASTER
  
  spark-master:
    build:
      context: ./streaming/spark
      dockerfile: Dockerfile
    container_name: spark-master
    hostname: spark-master
    command:
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.master.Master
    ports:
      - "127.0.0.1:9090:8080"
      - "127.0.0.1:7077:7077"

    environment:
      AWS_ACCESS_KEY: $(AWS_ACCESS_KEY}
      AWS_SECRET_KEY: ${AWS_SECRET_kEY}
    volumes:
      - ./streaming:/streaming
      - ./batching:/batching
    networks:
      - aviation
    restart: unless-stopped

  
  # SPARK WORKER 1
  
  spark-worker1:
    build:
      context: ./streaming/spark
      dockerfile: Dockerfile
    container_name: spark-worker1
    hostname: spark-worker1
    command:
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.worker.Worker
      - spark://spark-master:7077
    environment:
      SPARK_WORKER_MEMORY: 6g
      SPARK_WORKER_CORES: 6
      SPARK_MASTER: spark://spark-master:7077
    ports:
      - "127.0.0.1:9101:8081"
    volumes:
      - ./streaming:/streaming
      - ./batching:/batching
    depends_on:
      - spark-master
    networks:
      - aviation
    restart: unless-stopped

  
  # SPARK WORKER 2
  
  spark-worker2:
    build:
      context: ./streaming/spark
      dockerfile: Dockerfile
    container_name: spark-worker2
    hostname: spark-worker2
    command:
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.worker.Worker
      - spark://spark-master:7077
    environment:
      SPARK_WORKER_MEMORY: 6g
      SPARK_WORKER_CORES: 6
      SPARK_MASTER: spark://spark-master:7077
    ports:
      - "127.0.0.1:9102:8081"
    volumes:
      - ./streaming:/streaming
      - ./batching:/batching
    depends_on:
      - spark-master
    networks:
      - aviation
    restart: unless-stopped

  #Weather validation

  weather_validation_job:
    build:
      context: ./streaming/spark
      dockerfile: Dockerfile

    container_name: weather_validation_job

    environment:
      AWS_ACCESS_KEY: ${AWS_ACCESS_KEY}
      AWS_SECRET_KEY: ${AWS_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET}
      S3_INVALID_PREFIX: ${S3_INVALID_PREFIX}

    entrypoint: [ "/bin/bash", "-c" ]
    command:
      - |
        sleep 15
        exec /opt/spark/bin/spark-submit \
          --master spark://spark-master:7077 \
          --deploy-mode client \
          --executor-cores 1 \
          --executor-memory 1500m \
          --conf spark.executor.memoryOverhead=512m \
          --conf spark.sql.shuffle.partitions=2 \
          --conf spark.default.parallelism=2 \
          --conf spark.network.timeout=600s \
          --conf spark.cores.max=2 \
          --conf spark.driver.extraClassPath=/opt/spark/jars/* \
          --conf spark.executor.extraClassPath=/opt/spark/jars/* \
          /spark/validate_weather_job.py

    depends_on:
      spark-master:
        condition: service_started
      spark-worker1:
        condition: service_started
      spark-worker2:
        condition: service_started

    networks:
      - aviation

    restart: unless-stopped

