name: CD - Deploy to EC2

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up SSH Key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.EC2_SSH_KEY }}

      - name: Deploy to EC2
        shell: /usr/bin/bash -e {0}
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          CLICKHOUSE_USER: ${{ secrets.CLICKHOUSE_USER }}
          CLICKHOUSE_PASSWORD: ${{ secrets.CLICKHOUSE_PASSWORD }}
          CLICKHOUSE_DATABASE: ${{ secrets.CLICKHOUSE_DATABASE }}
          AWS_ACCESS_KEY: ${{ secrets.AWS_ACCESS_KEY }}
          AWS_SECRET_KEY: ${{ secrets.AWS_SECRET_KEY }}
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
          API_KEY: ${{ secrets.API_KEY }}
          KAFKA_BOOTSTRAP_SERVERS: ${{ secrets.KAFKA_BOOTSTRAP_SERVERS }}
          PROJECT_DIR: ${{ vars.PROJECT_DIR }}
          REPO_URL: ${{ vars.REPO_URL }}
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -T 15 -H "$EC2_HOST" >> ~/.ssh/known_hosts
          if [ ! -s ~/.ssh/known_hosts ]; then
            echo "::error::Cannot reach port 22 on EC2_HOST. Check the instance is running, EC2_HOST is its current public IP, and the security group allows SSH."
            exit 1
          fi

          SSH="ssh -o BatchMode=yes -o ServerAliveInterval=30 $EC2_USER@$EC2_HOST"

          echo "[1/3] Updating repository on EC2..."
          $SSH "set -e
            mkdir -p '$PROJECT_DIR'
            if [ ! -d '$PROJECT_DIR/.git' ]; then
              git clone '$REPO_URL' '$PROJECT_DIR'
            else
              cd '$PROJECT_DIR'
              git fetch origin main
              git reset --hard origin/main
            fi"

          echo "[2/3] Writing .env file..."
          {
            printf 'CLICKHOUSE_USER=%s\n'          "$CLICKHOUSE_USER"
            printf 'CLICKHOUSE_PASSWORD=%s\n'      "$CLICKHOUSE_PASSWORD"
            printf 'CLICKHOUSE_DATABASE=%s\n'      "$CLICKHOUSE_DATABASE"
            printf 'AWS_ACCESS_KEY=%s\n'           "$AWS_ACCESS_KEY"
            printf 'AWS_SECRET_KEY=%s\n'           "$AWS_SECRET_KEY"
            printf 'S3_BUCKET=%s\n'                "$S3_BUCKET"
            printf 'API_KEY=%s\n'                  "$API_KEY"
            printf 'KAFKA_BOOTSTRAP_SERVERS=%s\n'  "$KAFKA_BOOTSTRAP_SERVERS"
          } | $SSH "set -e; mkdir -p '$PROJECT_DIR' && umask 077 && cat > '$PROJECT_DIR/.env'"

          echo "[3/3] Rebuilding and starting Docker Compose stack..."
          $SSH "set -e
            cd '$PROJECT_DIR'
            docker compose up -d --build --remove-orphans
            docker image prune -f"